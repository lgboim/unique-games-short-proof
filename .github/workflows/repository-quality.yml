name: Repository quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata validator
        run: python -m pip install PyYAML==6.0.3

      - name: Verify SHA-256 manifest and Zenodo checksums
        run: python verify_manifest.py --check

      - name: Compile public Python scripts
        run: python -m compileall -q verify_manifest.py lean_check

      - name: Validate JSON metadata
        run: |
          python -m json.tool codemeta.json >/dev/null
          python -m json.tool public_manifest.json >/dev/null

      - name: Validate citation metadata
        run: python -c "import yaml; yaml.safe_load(open('CITATION.cff', encoding='utf-8'))"

      - name: Validate issue templates
        run: python -c "import glob, yaml; [yaml.safe_load(open(f, encoding='utf-8')) for f in glob.glob('.github/ISSUE_TEMPLATE/*.yml')]"

      - name: Check required public files
        run: |
          test -s README.md
          test -s CITATION.cff
          test -s codemeta.json
          test -s LICENSE-CODE.txt
          test -s LICENSE-DOCUMENTATION-DATA.txt
          test -s LICENSE-SCOPE.md
          test -s papers/ugc_short_proof.pdf
          test -s papers/ugc_short_proof.tex
          test -s papers/ugc_short_proof_companion_note.pdf
          test -s papers/ugc_short_proof_companion_note.tex
          test -s papers/ugc_faithful_presentation.pdf
          test -s papers/ugc_faithful_presentation.tex
          test -s lean_check/ugc_lean_check.py
          test -s lean_check/ugc-lean-ugt-check.log
          test -s lean_check/ugc_out.zip

      - name: Reject tracked caches, secrets and private paths
        run: |
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
          test -z "$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$' || true)"
          test -z "$(git grep -l -E '/Users/[a-z]+/|/private/tmp' -- ':!*.pdf' ':!*.zip' ':!.github/workflows/*' || true)"
